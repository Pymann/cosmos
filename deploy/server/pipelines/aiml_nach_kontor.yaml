# aiml nach kontor spiegeln (doc/spec/112 §112.5).
#
# Laeuft auf dem Knoten-Agenten des kontor-Servers: kein `image:`, also
# `steplayer: none` (doc/spec/110 F110-125) — die Schritte arbeiten im
# Sandkasten auf dem Dateisystem des Wirts und sehen dort /usr und /etc.
# Die Arbeit tut `aiml-mirror` (deploy/server/libexec, auf dem Server unter
# /usr/local/libexec/cosmos); hier stehen nur die Stufen.
#
# Ergebnis in kontor:
#   /generic/aiml/<fassung>/aiml-<fassung>-linux-x86_64.tar.gz(.sha256)
#   /generic/aiml/latest.env      ← liest .github/ci/setup-aiml.sh (AIML_KONTOR_URL)
#
# Ist kontor schon aktuell, enden alle Stufen nach `quelle` sofort (F112-11).
- pipeline:
    name: aiml_nach_kontor
    steps:
      - stage:
          name: quelle
          requires: [curl, jq]
          timeout: 120000
          run: "/usr/local/libexec/cosmos/aiml-mirror quelle"
      - stage:
          name: holen
          requires: [curl, unzip, sha256sum]
          timeout: 1800000
          run: "/usr/local/libexec/cosmos/aiml-mirror holen"
      - stage:
          name: pruefen
          requires: [tar, ldd]
          timeout: 300000
          run: "/usr/local/libexec/cosmos/aiml-mirror pruefen"
      - stage:
          name: hochladen
          requires: [curl]
          timeout: 1800000
          run: "/usr/local/libexec/cosmos/aiml-mirror hochladen"
      - stage:
          name: aufraeumen
          timeout: 120000
          run: "/usr/local/libexec/cosmos/aiml-mirror aufraeumen"

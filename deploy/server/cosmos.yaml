# Erklaerung des kontor-Servers (doc/spec/111 §111.1, doc/spec/112).
# Liegt auf dem Server unter /etc/cosmos/cosmos.yaml; cosmosd wendet sie bei
# jedem Start an (COSMOS_CASC) und startet NICHT, wenn sie fehlerhaft ist.
# Pfade sind relativ zu dieser Datei (also /etc/cosmos/pipelines/…).
- catalog:
    jobs:
      # stuendlich; ist kontor aktuell, kostet ein Lauf zwei kleine Anfragen.
      - job: { name: aiml_nach_kontor, source: pipelines/aiml_nach_kontor.yaml, project: aiml, interval_s: 3600 }

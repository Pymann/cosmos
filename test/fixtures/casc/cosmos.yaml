- config:
    roles:
      - role: { name: operator, may: [run_job, pause_run, resume_run] }
      - role: { name: viewer, may: [get_cluster, read_run_output] }
    grants:
      - grant: { user: alice@example.org, role: operator }
      - grant: { group: devs, role: viewer }
    secrets:
      - secret: { name: hook, file: secrets/hook.secret }
      - secret: { name: mtok, env: COSMOS_TEST_KONTOR_TOKEN }
    kontor: { url: "http://127.0.0.1:18081", webhook_secret: hook, token: mtok }
- catalog:
    jobs:
      - job: { name: net, source: ci/core.aiml, project: net, triggers: [kontor] }
    from_dir:
      - { path: ci, triggers: [kontor] }

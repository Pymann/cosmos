name: E2E

# The acceptance runs (run_e2e*.sh): real processes -- cosmosd, cosmos-api,
# agents, a test sshd, a throwaway slapd -- talking over sockets.  They were
# never part of CI, and four of them had drifted from the code they accept
# (2026-11-25).  One job per suite, so a red one names itself.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      aiml_release:
        description: "aiml release tag to build with (empty = newest release, else newest green aiml CI run)"
        required: false
        default: ""

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite:
          - run_e2e.sh
          - run_e2e_provision.sh
          - run_e2e_api.sh
          - run_e2e_console.sh
          - run_e2e_pipeline.sh
          - run_e2e_identity.sh
          - run_e2e_chaos.sh
          # The two memory checks (doc/spec/90 §AP1.5a, doc/spec/92 §92.7): the
          # server and CAS must not hold output or content in memory.
          - run_mem_check.sh
          - run_cas_mem_check.sh
          # The git connection (doc/spec/114): a local repository over smart
          # HTTP, ufo, a stand-in for the GitHub status API.
          - run_e2e_git.sh
    env:
      AIML_CACHE: ${{ github.workspace }}/__aiml_cache
      AIML_MEM_V3: "1"
    steps:
      - uses: actions/checkout@v4

      # bubblewrap: the step sandbox (doc/spec/91).  slapd, ldap-utils,
      # xmlsec1: the directory and the IdP of run_e2e_identity.sh.
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libssl-dev curl jq \
            libldap-dev xmlsec1 slapd ldap-utils bubblewrap time
          # Ubuntu 24.04 keeps unprivileged user namespaces behind AppArmor;
          # bwrap needs one for every step.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # slapd's packaged profile keeps it out of the test's directory.
          if [ -f /etc/apparmor.d/usr.sbin.slapd ]; then
            sudo ln -sf /etc/apparmor.d/usr.sbin.slapd /etc/apparmor.d/disable/
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd || true
          fi

      - name: Download aiml
        env:
          GH_TOKEN: ${{ github.token }}
          AIML_RELEASE: ${{ github.event.inputs.aiml_release || vars.AIML_RELEASE }}
          AIML_KONTOR_URL: ${{ secrets.KONTOR_URL }}
          AIML_KONTOR_CA: ${{ secrets.KONTOR_CA }}
          AIML_KONTOR_TOKEN: ${{ secrets.KONTOR_TOKEN }}
        run: bash .github/ci/setup-aiml.sh "$RUNNER_TEMP/aimlvenv"

      # Every script builds what it needs with the active venv (aiml build).
      # The console offer library is the one artifact none of them builds.
      - name: Build the console offer library
        if: matrix.suite == 'run_e2e_console.sh'
        run: aiml build -c exodus-console-offer.json

      # run_e2e_git.sh needs ufo (Pymann/ufo), built with the same venv.
      - name: Checkout ufo
        if: matrix.suite == 'run_e2e_git.sh'
        uses: actions/checkout@v4
        with:
          repository: Pymann/ufo
          path: ufo-src
          token: ${{ secrets.UFO_READ_TOKEN || github.token }}
      - name: Build ufo
        if: matrix.suite == 'run_e2e_git.sh'
        run: |
          (cd ufo-src && aiml build -c exodus.json)
          echo "UFO_BIN=$GITHUB_WORKSPACE/ufo-src/ufo" >> "$GITHUB_ENV"

      # run_mem_check.sh drives the binaries run_e2e.sh builds and builds none itself.
      - name: Build for the memory check
        if: matrix.suite == 'run_mem_check.sh'
        run: |
          for cfg in exodus-cosmosd.json exodus-agent.json exodus-test-e2e.json exodus-test-enroll.json; do
            aiml build -c "$cfg"
          done

      - name: ${{ matrix.suite }}
        run: timeout 2400 bash "${{ matrix.suite }}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.suite }}
          path: logs/
          if-no-files-found: ignore

  # kontor and cosmos together (doc/spec/111 §111.6/§111.9): webhooks,
  # rebuild campaigns, OCI push and pull.  Pymann/kontor is public and is
  # cloned without a token.  The kontor server itself is reached through the
  # secrets KONTOR_URL, KONTOR_TOKEN and KONTOR_CA (as in ci.yml); today only
  # setup-aiml.sh uses them, later also pushes of stage results.
  e2e-kontor:
    name: run_e2e_kontor.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AIML_CACHE: ${{ github.workspace }}/__aiml_cache
      AIML_MEM_V3: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Checkout kontor
        id: kontor
        run: |
          # Pymann/kontor is public: a clone needs no token.  A failed clone fails the job.
          git clone -q --depth 1 https://github.com/Pymann/kontor.git "$RUNNER_TEMP/kontor"
          echo "dir=$RUNNER_TEMP/kontor" >> "$GITHUB_OUTPUT"

      - name: System packages
        if: steps.kontor.outputs.dir != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libssl-dev curl jq libldap-dev xmlsec1

      - name: Download aiml
        if: steps.kontor.outputs.dir != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AIML_RELEASE: ${{ github.event.inputs.aiml_release || vars.AIML_RELEASE }}
          AIML_KONTOR_URL: ${{ secrets.KONTOR_URL }}
          AIML_KONTOR_CA: ${{ secrets.KONTOR_CA }}
          AIML_KONTOR_TOKEN: ${{ secrets.KONTOR_TOKEN }}
        run: bash .github/ci/setup-aiml.sh "$RUNNER_TEMP/aimlvenv"

      - name: run_e2e_kontor.sh
        if: steps.kontor.outputs.dir != ''
        env:
          KONTOR_DIR: ${{ steps.kontor.outputs.dir }}
        run: timeout 2400 bash run_e2e_kontor.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-run_e2e_kontor.sh
          path: logs/
          if-no-files-found: ignore

  # The wasm probes (run_wasm_probes.sh): `aiml build` with output_type wasm
  # (aiml spec/68 §7.1), linked by emcc of the version the release names in
  # lib/wasm32/emsdk.version, run in node.  An aiml release without wasm
  # builds says so and the job passes with a notice.
  wasm-probes:
    name: run_wasm_probes.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AIML_CACHE: ${{ github.workspace }}/__aiml_cache
      AIML_MEM_V3: "1"
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libssl-dev curl jq libldap-dev xmlsec1

      - name: Download aiml
        env:
          GH_TOKEN: ${{ github.token }}
          AIML_RELEASE: ${{ github.event.inputs.aiml_release || vars.AIML_RELEASE }}
          AIML_KONTOR_URL: ${{ secrets.KONTOR_URL }}
          AIML_KONTOR_CA: ${{ secrets.KONTOR_CA }}
          AIML_KONTOR_TOKEN: ${{ secrets.KONTOR_TOKEN }}
        run: bash .github/ci/setup-aiml.sh "$RUNNER_TEMP/aimlvenv"

      - name: Does this aiml build wasm?
        id: can
        run: |
          if [ ! -f "$AIML_VENV/lib/wasm32/emsdk.version" ]; then
            echo "::notice::this aiml release carries no lib/wasm32 (spec/68 F68-90), run_wasm_probes.sh skipped"; exit 0
          fi
          out=$(aiml build -c exodus-test-ptrref-wasm.json 2>&1 || true)
          if echo "$out" | grep -q "output_type 'wasm'"; then
            echo "::notice::this aiml release does not build wasm yet (spec/68 F68-88), run_wasm_probes.sh skipped"; exit 0
          fi
          echo "emsdk=$(tr -d '[:space:]' < "$AIML_VENV/lib/wasm32/emsdk.version")" >> "$GITHUB_OUTPUT"

      - name: emsdk
        if: steps.can.outputs.emsdk != ''
        run: |
          git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install "${{ steps.can.outputs.emsdk }}" > /dev/null
          ./emsdk activate "${{ steps.can.outputs.emsdk }}" > /dev/null
          . ./emsdk_env.sh > /dev/null
          echo "$(dirname "$(command -v emcc)")" >> "$GITHUB_PATH"
          # Newer emsdk_env.sh no longer exports EM_CONFIG; the config is .emscripten
          # in the emsdk dir (it names BINARYEN_ROOT, so emcc finds wasm-opt).
          echo "EM_CONFIG=${EM_CONFIG:-$PWD/.emscripten}" >> "$GITHUB_ENV"
          emcc --version | head -1

      - name: run_wasm_probes.sh
        if: steps.can.outputs.emsdk != ''
        run: timeout 2400 bash run_wasm_probes.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-run_wasm_probes.sh
          path: logs/
          if-no-files-found: ignore
